[package]
name = "p2r-tunnel"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
iroh = "1.4.1"
iroh-relay = "1.4.1"
rustls-pemfile = "2"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1", "server"] }
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
spake2 = "0.4"
hmac = "0.12"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
iroh = { version = "1.4.1", features = ["test-utils"] }
iroh-relay = { version = "1.4.1", features = ["test-utils", "server"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
