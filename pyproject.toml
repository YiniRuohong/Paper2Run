[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2run"
version = "0.1.0"
description = "Paper2Run API and contracts"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2,<3",
  "sqlalchemy>=2,<3",
  "alembic>=1.13,<2",
  "pypdf[crypto]>=6.21,<7",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["services/api", "packages/contracts", "packages/artifacts", "packages/persistence", "packages/sandbox", "packages/docparse", "packages/evaluation", "packages/codegen", "packages/runner", "packages/kernel", "packages/orchestration"]
testpaths = ["tests"]

[tool.setuptools.package-data]
p2r_runner = ["data/*.csv"]

[tool.setuptools.packages.find]
where = ["services/api", "packages/contracts", "packages/artifacts", "packages/persistence", "packages/sandbox", "packages/docparse", "packages/evaluation", "packages/codegen", "packages/runner", "packages/kernel", "packages/orchestration"]
include = ["p2r_api*", "p2r_contracts*", "p2r_artifacts*", "p2r_persistence*", "p2r_sandbox*", "p2r_docparse*", "p2r_evaluation*", "p2r_codegen*", "p2r_runner*", "p2r_kernel*", "p2r_orchestration*"]
